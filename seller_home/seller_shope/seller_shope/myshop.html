<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriConnect - My Shop & Analytics</title>
    <!-- ======= Styles ====== -->
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="../../../../js/app-engine.js"></script>
    <script>
      const seller = AgriConnect.requireAuth('seller');
    </script>
</head>

<body>
    <!-- =============== Navigation ================ -->
    <div class="container">
        <div class="navigation">
            <ul>
                <li>
                    <a href="#">
                        <span class="title" style="font-size:22px; font-weight:bold; color:white;">AgriConnect</span>
                    </a>
                </li>

                <li>
                    <a href="../../Seller_page.html">
                        <span class="icon">
                            <ion-icon name="home-outline"></ion-icon>
                        </span>
                        <span class="title">Dashboard</span>
                    </a>
                </li>

                <li>
                    <a href="../../../show_request/show_contract.html">
                        <span class="icon">
                            <ion-icon name="people-outline"></ion-icon>
                        </span>
                        <span class="title">Customer Requests</span>
                    </a>
                </li>

                <li>
                    <a href="../../../contracts/seller_contract.html">
                        <span class="icon">
                            <ion-icon name="document-text-outline"></ion-icon>
                        </span>
                        <span class="title">Contracts</span>
                    </a>
                </li>

                <li>
                    <a href="../../../Seller Page of vegetables/Firstpage.html">
                        <span class="icon">
                            <ion-icon name="add-circle-outline"></ion-icon>
                        </span>
                        <span class="title">Add Products</span>
                    </a>
                </li>

                <li>
                    <a href="../../../contact_us/contact.html">
                        <span class="icon">
                            <ion-icon name="help-outline"></ion-icon>
                        </span>
                        <span class="title">Support</span>
                    </a>
                </li>

                <li>
                    <a href="#" onclick="AgriConnect.logout(); return false;">
                        <span class="icon">
                            <ion-icon name="log-out-outline"></ion-icon>
                        </span>
                        <span class="title">Sign Out</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- ========================= Main ==================== -->
        <div class="main">
            <div class="topbar">
                <div class="toggle">
                    <ion-icon name="menu-outline"></ion-icon>
                </div>

                <div class="search">
                    <label>
                        <input type="text" placeholder="Search here">
                        <ion-icon name="search-outline"></ion-icon>
                    </label>
                </div>

                <div class="user">
                    <img src="assets/imgs/customer01.jpg" alt="">
                </div>
            </div>

            <!-- ======================= Cards ================== -->
            <div class="cardBox">
                <div class="card">
                    <div>
                        <div class="numbers" id="stat-products">0</div>
                        <div class="cardName">Active Products</div>
                    </div>

                    <div class="iconBx">
                        <ion-icon name="basket-outline"></ion-icon>
                    </div>
                </div>

                <div class="card">
                    <div>
                        <div class="numbers" id="stat-requests">0</div>
                        <div class="cardName">Pending Requests</div>
                    </div>

                    <div class="iconBx">
                        <ion-icon name="cart-outline"></ion-icon>
                    </div>
                </div>

                <div class="card">
                    <div>
                        <div class="numbers" id="stat-contracts">0</div>
                        <div class="cardName">Active Contracts</div>
                    </div>

                    <div class="iconBx">
                        <ion-icon name="document-text-outline"></ion-icon>
                    </div>
                </div>

                <div class="card">
                    <div>
                        <div class="numbers" id="stat-earnings">₹0.00</div>
                        <div class="cardName">Total Contract Value</div>
                    </div>

                    <div class="iconBx">
                        <ion-icon name="cash-outline"></ion-icon>
                    </div>
                </div>
            </div>

            <!-- ================ Order Details List ================= -->
            <div class="details">
                <div class="recentOrders">
                    <div class="cardHeader">
                        <h2>Recent Buyer Orders & Requests</h2>
                        <a href="../../../show_request/show_contract.html" class="btn">View All</a>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <td>Product Name</td>
                                <td>Quantity</td>
                                <td>Total Amount</td>
                                <td>Status</td>
                            </tr>
                        </thead>

                        <tbody id="shop-orders-tbody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>

                <!-- ================= New Customers ================ -->
                <div class="recentCustomers">
                    <div class="cardHeader">
                        <h2>Active Buyers</h2>
                    </div>

                    <table id="shop-customers-table">
                        <!-- Populated dynamically -->
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- =========== Scripts =========  -->
    <script src="assets/js/main.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
          renderShopDashboard();
      });

      function renderShopDashboard() {
          if (!seller) return;

          const products = AgriConnect.getSellerProducts(seller.id);
          const requests = AgriConnect.getSellerRequests(seller.id);
          const contracts = AgriConnect.getUserContracts(seller.id, 'seller');

          // 1. Stats
          document.getElementById('stat-products').textContent = products.length;
          
          const pendingCount = requests.filter(r => r.status === 'PENDING').length;
          document.getElementById('stat-requests').textContent = pendingCount;
          
          document.getElementById('stat-contracts').textContent = contracts.length;

          let totalVal = contracts.reduce((sum, c) => sum + (c.totalPrice || 0), 0);
          document.getElementById('stat-earnings').textContent = '₹' + totalVal.toFixed(2);

          // 2. Orders table
          const tbody = document.getElementById('shop-orders-tbody');
          tbody.innerHTML = '';

          if (requests.length === 0) {
              tbody.innerHTML = '<tr><td colspan="4">No buyer requests received yet.</td></tr>';
          } else {
              requests.slice(0, 8).forEach(req => {
                  const tr = document.createElement('tr');
                  let statusClass = 'pending';
                  if (req.status === 'ACCEPTED') statusClass = 'delivered';
                  if (req.status === 'REJECTED') statusClass = 'return';

                  tr.innerHTML = `
                      <td>${req.productName}</td>
                      <td>${req.quantity} ${req.unit || 'kg'}</td>
                      <td>₹${req.totalPrice.toFixed(2)}</td>
                      <td><span class="status ${statusClass}">${req.status}</span></td>
                  `;
                  tbody.appendChild(tr);
              });
          }

          // 3. Active Buyers table
          const custTable = document.getElementById('shop-customers-table');
          custTable.innerHTML = '';

          const uniqueBuyersMap = {};
          requests.forEach(r => {
              uniqueBuyersMap[r.buyerId] = r.buyerName;
          });

          const buyerNames = Object.values(uniqueBuyersMap);
          if (buyerNames.length === 0) {
              custTable.innerHTML = '<tr><td colspan="2">No active buyers yet.</td></tr>';
          } else {
              buyerNames.forEach(name => {
                  const tr = document.createElement('tr');
                  tr.innerHTML = `
                      <td width="60px">
                          <div class="imgBx"><img src="assets/imgs/customer01.jpg" alt="user"></div>
                      </td>
                      <td>
                          <h4>${name} <br> <span>Verified Buyer</span></h4>
                      </td>
                  `;
                  custTable.appendChild(tr);
              });
          }
      }
    </script>

    <!-- ====== ionicons ======= -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
