<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="log.css">
    <title>Contrafarm| Login & Registration</title>
    <style>
        /* Hide scrollbar for all browsers */
        .form-box, .login-container, .register-container {
            overflow-y: scroll;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .form-box::-webkit-scrollbar,
        .login-container::-webkit-scrollbar,
        .register-container::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
 <div class="wrapper">
    <nav class="nav">
        <div class="nav-logo">
            <p>CONTRAFARM</p>
        </div>
        <div class="nav-menu" id="navMenu">
            <ul>
                
            </ul>
        </div>
        <div class="nav-button">
            <button class="btn white-btn" id="loginBtn" onclick="showLogin()">Sign In</button>
            <button class="btn" id="registerBtn" onclick="showRegister()">Sign Up</button>
        </div>
        <div class="nav-menu-btn">
            <i class="bx bx-menu" onclick="myMenuFunction()"></i>
        </div>
    </nav>

    <!----------------------------- Form box ----------------------------------->    
    <div class="form-box">
        
        <!------------------- login form -------------------------->

        <div class="login-container" id="login">
            <div class="top">
                <span>Don't have an account? <a href="#" onclick="showRegister()">Sign Up</a></span>
                <header>Login as a buyer</header>
            </div>
            <form id="buyerLoginForm" onsubmit="handleBuyerLogin(event)">
                <div class="input-box">
                    <input type="text" class="input-field" placeholder="Username or Email" id="buyerUsername" required>
                    <i class="bx bx-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" class="input-field" placeholder="Password" id="buyerPassword" required>
                    <i class="bx bx-lock-alt"></i>
                </div>
                <div class="input-box">
                    <input type="submit" class="submit" value="Sign In">
                </div>
                <div class="two-col">
                    <div class="one">
                        <input type="checkbox" id="login-check">
                        <label for="login-check"> Remember Me</label>
                    </div>
                    <div class="two">
                        <label><a href="#">Forgot password?</a></label>
                    </div>
                </div>
            </form>
        </div>


        <!------------------- registration form -------------------------->

        <div class="register-container" id="register">
            <div class="top">
                <span>Have an account? <a href="#" onclick="showLogin()">Login</a></span>
                <header>Sign Up as a buyer</header>
            </div>
            <form id="buyerRegisterForm" onsubmit="handleBuyerRegister(event)">
                <div class="two-forms">
                    <div class="input-box">
                        <input type="text" class="input-field" placeholder="Firstname" id="bFname" required>
                        <i class="bx bx-user"></i>
                    </div>
                    <div class="input-box">
                        <input type="text" class="input-field" placeholder="Lastname" id="bLname" required>
                        <i class="bx bx-user"></i>
                    </div>
                </div>
                <div class="input-box">
                    <input type="email" class="input-field" placeholder="Email" id="bEmail" required>
                    <i class="bx bx-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" class="input-field" placeholder="Password" id="bPassword" required>
                    <i class="bx bx-lock-alt"></i>
                </div>

                <!-- Location input field -->
                <div class="input-box">
                    <input type="text" class="input-field" placeholder="Location" id="bLocation" required>
                    <i class="bx bx-map"></i>
                </div>

                <!-- Radio buttons for Individual Buyer / Mass Buyer -->
                <div class="input-box" style="display:flex; justify-content:space-around; align-items:center; color:white; padding:10px 0;">
                    <label for="individualBuyer">
                        <input type="radio" id="individualBuyer" name="buyerType" value="Individual Buyer" checked> Individual Buyer
                    </label>
                    <label for="massBuyer">
                        <input type="radio" id="massBuyer" name="buyerType" value="Mass Buyer"> Mass Buyer
                    </label>
                </div>

                <div class="input-box">
                    <input type="submit" class="submit" value="Register">
                </div>
                <div class="two-col">
                    <div class="one">
                        <input type="checkbox" id="register-check">
                        <label for="register-check"> Remember Me</label>
                    </div>
                    <div class="two">
                        <label><a href="#">Terms & conditions</a></label>
                    </div>
                </div>

                <!-- Sign In button at the bottom of the Sign Up form -->
                <div class="input-box">
                    <button type="button" class="btn" onclick="showLogin()">Sign In</button>
                </div>
            </form>
        </div>
    </div>
</div>   

<script src="../js/app-engine.js"></script>
<script>
   function myMenuFunction() {
       var i = document.getElementById("navMenu");
       if (i.className === "nav-menu") {
           i.className += " responsive";
       } else {
           i.className = "nav-menu";
       }
   }

   var a = document.getElementById("loginBtn");
   var b = document.getElementById("registerBtn");
   var x = document.getElementById("login");
   var y = document.getElementById("register");

   function showLogin() {
       x.style.left = "4px";
       y.style.right = "-520px";
       a.className += " white-btn";
       b.className = "btn";
       x.style.opacity = 1;
       y.style.opacity = 0;
   }

   function showRegister() {
       x.style.left = "-510px";
       y.style.right = "5px";
       a.className = "btn";
       b.className += " white-btn";
       x.style.opacity = 0;
       y.style.opacity = 1;
   }

   function handleBuyerLogin(event) {
       event.preventDefault();
       var username = document.getElementById("buyerUsername").value.trim();
       var password = document.getElementById("buyerPassword").value.trim();

       var res = AgriConnect.loginUser(username, password, "buyer");
       if (res.success) {
           window.location.href = "../buyer_home/buyerHome.html";
       } else {
           alert(res.message);
       }
   }

   function handleBuyerRegister(event) {
       event.preventDefault();
       var fname = document.getElementById("bFname").value.trim();
       var lname = document.getElementById("bLname").value.trim();
       var email = document.getElementById("bEmail").value.trim();
       var password = document.getElementById("bPassword").value.trim();
       var location = document.getElementById("bLocation").value.trim();
       var selectedType = document.querySelector("input[name='buyerType']:checked");
       var buyerType = selectedType ? selectedType.value : "Individual Buyer";

       var res = AgriConnect.registerUser({
           username: email.split('@')[0],
           email: email,
           password: password,
           role: "buyer",
           name: fname + " " + lname,
           location: location,
           buyerType: buyerType
       });

       if (res.success) {
           alert("Buyer registration successful! Redirecting to buyer portal...");
           window.location.href = "../buyer_home/buyerHome.html";
       } else {
           alert(res.message);
       }
   }
</script>

</body>
</html>
