<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="log.css">
    <title>Contrafarm| Login & Registration</title>
    <style>
        /* Hide scrollbar for all browsers */
        .form-box, .login-container, .register-container {
            overflow-y: scroll;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        .form-box::-webkit-scrollbar,
        .login-container::-webkit-scrollbar,
        .register-container::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
 <div class="wrapper">
    <nav class="nav">
        <div class="nav-logo">
            <p>CONTRAFARM</p>
        </div>
        <div class="nav-menu" id="navMenu">
            <ul>
                
            </ul>
        </div>
        <div class="nav-button">
            <button class="btn white-btn" id="loginBtn" onclick="showLogin()">Sign In</button>
            <button class="btn" id="registerBtn" onclick="showRegister()">Sign Up</button>
        </div>
        <div class="nav-menu-btn">
            <i class="bx bx-menu" onclick="myMenuFunction()"></i>
        </div>
    </nav>

    <!----------------------------- Form box ----------------------------------->    
    <div class="form-box">
        
        <!------------------- login form -------------------------->

        <div class="login-container" id="login">
            <div class="top">
                <span>Don't have an account? <a href="../buyer_home/buyerHome.html" >Sign in</a></span>
                <header>Login as a buyer</header>
            </div>
            <div class="input-box">
                <input type="text" class="input-field" placeholder="Username or Email" id="username">
                <i class="bx bx-user"></i>
            </div>
            <div class="input-box">
                <input type="password" class="input-field" placeholder="Password" id="password">
                <i class="bx bx-lock-alt"></i>
            </div>
            <div class="input-box">
                <input type="submit" class="submit" value="Sign In" onclick="signIn()">
            </div>
            <div class="two-col">
                <div class="one">
                    <input type="checkbox" id="login-check">
                    <label for="login-check"> Remember Me</label>
                </div>
                <div class="two">
                    <label><a href="#">Forgot password?</a></label>
                </div>
            </div>
        </div>


        <!------------------- registration form -------------------------->

        <div class="register-container" id="register">
            <div class="top">
                <span>Have an account? <a href="#" onclick="showLogin()">Login</a></span>
                <header>Sign Up as a buyer</header>
            </div>
            <div class="two-forms">
                <div class="input-box">
                    <input type="text" class="input-field" placeholder="Firstname">
                    <i class="bx bx-user"></i>
                </div>
                <div class="input-box">
                    <input type="text" class="input-field" placeholder="Lastname">
                    <i class="bx bx-user"></i>
                </div>
            </div>
            <div class="input-box">
                <input type="text" class="input-field" placeholder="Email">
                <i class="bx bx-envelope"></i>
            </div>
            <div class="input-box">
                <input type="password" class="input-field" placeholder="Password">
                <i class="bx bx-lock-alt"></i>
            </div>

            <!-- Location input field -->
            <div class="input-box">
                <input type="text" class="input-field" placeholder="Location">
                <i class="bx bx-map"></i>
            </div>

            <!-- Radio buttons for Individual Buyer / Mass Buyer -->
            <div class="input-box">
                <label for="individualBuyer">
                    <input type="radio" id="individualBuyer" name="buyerType" value="Individual Buyer"> Individual Buyer
                </label>
                <label for="massBuyer">
                    <input type="radio" id="massBuyer" name="buyerType" value="Mass Buyer"> Mass Buyer
                </label>
            </div>

            <div class="input-box">
                <input type="submit" class="submit" value="Register" >
            </div>
            <div class="two-col">
                <div class="one">
                    <input type="checkbox" id="register-check">
                    <label for="register-check"> Remember Me</label>
                </div>
                <div class="two">
                    <label><a href="#">Terms & conditions</a></label>
                </div>
            </div>

            <!-- Sign In button at the bottom of the Sign Up form -->
            <div class="input-box">
                <button class="btn" onclick="showLogin()">Sign In</button>
            </div>
        </div>
    </div>
</div>   

<script>
   function myMenuFunction() {
       var i = document.getElementById("navMenu");
       if (i.className === "nav-menu") {
           i.className += " responsive";
       } else {
           i.className = "nav-menu";
       }
   }

   var a = document.getElementById("loginBtn");
   var b = document.getElementById("registerBtn");
   var x = document.getElementById("login");
   var y = document.getElementById("register");

   function showLogin() {
       x.style.left = "4px";
       y.style.right = "-520px";
       a.className += " white-btn";
       b.className = "btn";
       x.style.opacity = 1;
       y.style.opacity = 0;
   }

   function showRegister() {
       x.style.left = "-510px";
       y.style.right = "5px";
       a.className = "btn";
       b.className += " white-btn";
       x.style.opacity = 0;
       y.style.opacity = 1;
   }

   // Function to handle the Sign In button click
   function signIn() {
       var username = document.getElementById("username").value;
       var password = document.getElementById("password").value;

       // Basic validation (you can expand this with actual login validation logic)
       if (username && password) {
           // Redirect to the next page (update the URL to your desired next page)
           window.location.href = "../buyer_home/buyerHome.html";
       } else {
           alert("Please enter both username and password.");
       }
   }
</script>

</body>
</html>
