<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contrafarm Vegetables</title>
  <link rel="stylesheet" href="buyervegetable.css">
</head>
<body>

  <!-- Menu Bar -->
  <header>
    <nav>
      <ul>
        <li><a href="../../index.html">Home</a></li>
        <li><a href="../buyerHome.html">Buyer Dashboard</a></li>
        <li><a href="../../show_request_buyer/show_contract.html">My Requests</a></li>
        <li><a href="../../contracts/buyer_contract.html">My Contracts</a></li>
        <li><a href="#" onclick="AgriConnect.logout(); return false;" style="color:#ff6b6b;">Logout</a></li>
      </ul>
      <div class="cart">
        <span>🛒</span>
        <span id="cart-count">0</span>
        <div id="cart-dropdown" class="cart-dropdown">
          <h4>Requests Cart</h4>
          <ul id="cart-items">
            <li>No items selected.</li>
          </ul>
          <button id="checkout-btn" onclick="openCheckoutWindow()" disabled>Submit Request(s)</button>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <section class="main-content">
    <h1>Available Fresh Products & Vegetables</h1>
    <p style="text-align:center; color:#555; margin-bottom:20px;">Browse produce directly offered by registered local farmers.</p>

    <div class="vegetable-container" id="buyer-catalog-container">
      <!-- Dynamically rendered from AgriConnect app-engine -->
    </div>
  </section>

  <!-- Checkout Modal -->
  <div id="checkout-modal" class="checkout-modal">
    <div class="checkout-content">
      <h2>Confirm Purchase Request</h2>
      <ul id="checkout-items"></ul>
      <p>Total Estimated Amount: ₹<span id="total-price">0.00</span></p>
      <button id="make-contract-btn" onclick="makeContract()">Submit Purchase Request</button>
      <button onclick="document.getElementById('checkout-modal').style.display='none'" style="background:#888; margin-left:10px;">Cancel</button>
    </div>
  </div>

  <script src="../../js/app-engine.js"></script>
  <script src="buyervegetable.js"></script>
</body>
</html>
