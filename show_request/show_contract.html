<!DOCTYPE html>
 <html lang="en">
 
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta http-equiv="X-UA-Compatible" content="ie=edge">
     <title>Coustomer_request</title>
     <link rel="stylesheet" type="text/css" href="show_contract.css">
 </head>
 
     <div style="background:#055032; padding:15px 30px; display:flex; justify-content:space-between; align-items:center;">
        <h2 style="color:white; margin:0;">AgriConnect - Seller Request Management</h2>
        <div>
           <a href="../seller_home/Seller_page.html" style="color:white; text-decoration:none; margin-right:20px;">Dashboard</a>
           <a href="../Seller Page of vegetables/Firstpage.html" style="color:white; text-decoration:none; margin-right:20px;">Products</a>
           <a href="../contracts/seller_contract.html" style="color:white; text-decoration:none; margin-right:20px;">Contracts</a>
           <a href="#" onclick="AgriConnect.logout(); return false;" style="color:#ff6b6b; text-decoration:none;">Logout</a>
        </div>
     </div>

     <main class="table" id="customers_table">
         <section class="table__header">
             <h1>Incoming Buyer Requests</h1>
             <div class="input-group">
                 <input type="search" placeholder="Search Data...">
                 <img src="images/search (1).png" alt="">
             </div>
             <div class="export__file">
                 <label for="export-file" class="export__file-btn" title="Export File"></label>
                 <input type="checkbox" id="export-file">
                 <div class="export__file-options">
                     <label>Export As &nbsp; &#10140;</label>
                     <label for="export-file" id="toPDF">PDF <img src="images/pdf.png" alt=""></label>
                     <label for="export-file" id="toJSON">JSON <img src="images/json.png" alt=""></label>
                     <label for="export-file" id="toCSV">CSV <img src="images/csv.png" alt=""></label>
                     <label for="export-file" id="toEXCEL">EXCEL <img src="images/excel.png" alt=""></label>
                 </div>
             </div>
         </section>
         <section class="table__body">
             <table>
                 <thead>
                     <tr>
                         <th> Request ID <span class="icon-arrow">&UpArrow;</span></th>
                         <th> Buyer Name <span class="icon-arrow">&UpArrow;</span></th>
                         <th> Product <span class="icon-arrow">&UpArrow;</span></th>
                         <th> Quantity <span class="icon-arrow">&UpArrow;</span></th>
                         <th> Total Price <span class="icon-arrow">&UpArrow;</span></th>
                         <th> Date <span class="icon-arrow">&UpArrow;</span></th>
                         <th> Status / Action <span class="icon-arrow">&UpArrow;</span></th>
                     </tr>
                 </thead>
                 <tbody id="seller-requests-tbody">
                     <!-- Dynamic content populated by JavaScript -->
                 </tbody>
             </table>
         </section>
     </main>

     <script src="../js/app-engine.js"></script>
     <script src="show_contract.js"></script>
 </body>
 </html>
